name: Build Desktop (Manual)

on:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.13.1
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C debuginfo=0"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build-desktop:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runs_on: macos-latest
            bundles: dmg
          - platform: linux
            runs_on: ubuntu-latest
            bundles: appimage,deb
          - platform: windows
            runs_on: windows-latest
            bundles: nsis
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2025-12-04

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          if apt-cache show libwebkit2gtk-4.1-dev >/dev/null 2>&1; then
            WEBKIT_PACKAGE=libwebkit2gtk-4.1-dev
          else
            WEBKIT_PACKAGE=libwebkit2gtk-4.0-dev
          fi
          if apt-cache show libayatana-appindicator3-dev >/dev/null 2>&1; then
            APPINDICATOR_PACKAGE=libayatana-appindicator3-dev
          else
            APPINDICATOR_PACKAGE=libappindicator3-dev
          fi
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            "${WEBKIT_PACKAGE}" \
            "${APPINDICATOR_PACKAGE}" \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run frontend:build

      - name: Build desktop app bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos' && '-' || '' }}
        run: cd crates/desktop && pnpm exec tauri build --ci --bundles ${{ matrix.bundles }}

      - name: Prepare macOS build asset
        if: matrix.platform == 'macos'
        run: |
          mkdir -p release-assets
          safe_ref="${GITHUB_REF_NAME//\//-}"
          dmg_path=$(find target/release/bundle -type f -name '*.dmg' | head -n 1)
          if [ -z "$dmg_path" ]; then
            echo "No dmg found in target/release/bundle"
            exit 1
          fi
          cp "$dmg_path" "release-assets/vibe-kanban-${safe_ref}-macos.dmg"

      - name: Prepare Linux build assets
        if: matrix.platform == 'linux'
        run: |
          mkdir -p release-assets
          safe_ref="${GITHUB_REF_NAME//\//-}"

          appimage_path=$(find target/release/bundle -type f -name '*.AppImage' | head -n 1)
          if [ -z "$appimage_path" ]; then
            echo "No AppImage found in target/release/bundle"
            exit 1
          fi
          cp "$appimage_path" "release-assets/vibe-kanban-${safe_ref}-linux.AppImage"

          deb_path=$(find target/release/bundle -type f -name '*.deb' | head -n 1)
          if [ -z "$deb_path" ]; then
            echo "No deb found in target/release/bundle"
            exit 1
          fi
          cp "$deb_path" "release-assets/vibe-kanban-${safe_ref}-linux.deb"

      - name: Prepare Windows build asset
        if: matrix.platform == 'windows'
        run: |
          mkdir -p release-assets
          safe_ref="${GITHUB_REF_NAME//\//-}"
          exe_path=$(find target/release/bundle -type f -name '*.exe' | head -n 1)
          if [ -z "$exe_path" ]; then
            echo "No exe found in target/release/bundle"
            exit 1
          fi
          cp "$exe_path" "release-assets/vibe-kanban-${safe_ref}-windows.exe"

      - name: Upload build assets
        uses: actions/upload-artifact@v4
        with:
          name: build-assets-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
