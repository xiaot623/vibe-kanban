name: Build Desktop Release

on:
  push:
    tags:
      - "**"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.13.1
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C debuginfo=0"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build-desktop:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            arch: arm64
            runs_on: macos-14
            bundles: dmg
          - platform: linux
            arch: x64
            runs_on: ubuntu-latest
            bundles: appimage,deb
          - platform: linux
            arch: arm64
            runs_on: ubuntu-24.04-arm
            bundles: appimage,deb
          - platform: windows
            arch: x64
            runs_on: windows-latest
            bundles: nsis
          - platform: windows
            arch: arm64
            runs_on: windows-11-arm
            bundles: nsis
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2025-12-04

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          if apt-cache show libwebkit2gtk-4.1-dev >/dev/null 2>&1; then
            WEBKIT_PACKAGE=libwebkit2gtk-4.1-dev
          else
            WEBKIT_PACKAGE=libwebkit2gtk-4.0-dev
          fi
          if apt-cache show libayatana-appindicator3-dev >/dev/null 2>&1; then
            APPINDICATOR_PACKAGE=libayatana-appindicator3-dev
          else
            APPINDICATOR_PACKAGE=libappindicator3-dev
          fi
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            "${WEBKIT_PACKAGE}" \
            "${APPINDICATOR_PACKAGE}" \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run frontend:build

      - name: Build desktop app bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos' && '-' || '' }}
        run: cd crates/desktop && pnpm exec tauri build --ci --bundles ${{ matrix.bundles }}

      - name: Prepare macOS release asset
        if: matrix.platform == 'macos'
        run: |
          mkdir -p release-assets
          safe_ref="${GITHUB_REF_NAME//\//-}"
          dmg_path=$(find target/release/bundle -type f -name '*.dmg' | head -n 1)
          if [ -z "$dmg_path" ]; then
            echo "No dmg found in target/release/bundle"
            exit 1
          fi
          cp "$dmg_path" "release-assets/vibe-kanban-${safe_ref}-macos-${{ matrix.arch }}.dmg"

      - name: Prepare Linux release assets
        if: matrix.platform == 'linux'
        run: |
          mkdir -p release-assets
          safe_ref="${GITHUB_REF_NAME//\//-}"

          appimage_path=$(find target/release/bundle -type f -name '*.AppImage' | head -n 1)
          if [ -z "$appimage_path" ]; then
            echo "No AppImage found in target/release/bundle"
            exit 1
          fi
          cp "$appimage_path" "release-assets/vibe-kanban-${safe_ref}-linux-${{ matrix.arch }}.AppImage"

          deb_path=$(find target/release/bundle -type f -name '*.deb' | head -n 1)
          if [ -z "$deb_path" ]; then
            echo "No deb found in target/release/bundle"
            exit 1
          fi
          cp "$deb_path" "release-assets/vibe-kanban-${safe_ref}-linux-${{ matrix.arch }}.deb"

      - name: Prepare Windows release asset
        if: matrix.platform == 'windows'
        run: |
          mkdir -p release-assets
          safe_ref="${GITHUB_REF_NAME//\//-}"
          exe_path=$(find target/release/bundle -type f -name '*.exe' | head -n 1)
          if [ -z "$exe_path" ]; then
            echo "No exe found in target/release/bundle"
            exit 1
          fi
          cp "$exe_path" "release-assets/vibe-kanban-${safe_ref}-windows-${{ matrix.arch }}.exe"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build-desktop
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
