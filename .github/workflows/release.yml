name: Build Desktop Release

on:
  push:
    tags:
      - "**"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.13.1
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C debuginfo=0"
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build-desktop:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runs_on: macos-latest
            bundles: app,dmg
          - platform: linux
            runs_on: ubuntu-latest
            bundles: appimage,deb
          - platform: windows
            runs_on: windows-latest
            bundles: nsis
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2025-12-04

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          if apt-cache show libwebkit2gtk-4.1-dev >/dev/null 2>&1; then
            WEBKIT_PACKAGE=libwebkit2gtk-4.1-dev
          else
            WEBKIT_PACKAGE=libwebkit2gtk-4.0-dev
          fi
          if apt-cache show libayatana-appindicator3-dev >/dev/null 2>&1; then
            APPINDICATOR_PACKAGE=libayatana-appindicator3-dev
          else
            APPINDICATOR_PACKAGE=libappindicator3-dev
          fi
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            "${WEBKIT_PACKAGE}" \
            "${APPINDICATOR_PACKAGE}" \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run frontend:build

      - name: Build desktop app bundle
        run: cd crates/desktop && pnpm exec tauri build --ci --bundles ${{ matrix.bundles }}

      - name: Sign app and recreate dmg
        if: matrix.platform == 'macos'
        run: |
          APP_NAME='Vibe Kanban'
          BUNDLE_DIR='target/release/bundle'
          APP_PATH="$BUNDLE_DIR/macos/$APP_NAME.app"
          DMG_DIR="$BUNDLE_DIR/dmg"

          if [ ! -d "$APP_PATH" ]; then
            echo "App bundle not found: $APP_PATH"
            exit 1
          fi

          codesign --force --deep --sign - "$APP_PATH"
          mkdir -p "$DMG_DIR"
          rm -f "$DMG_DIR"/*.dmg
          hdiutil create -volname "$APP_NAME" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_DIR/$APP_NAME.dmg"

      - name: Prepare macOS release asset
        if: matrix.platform == 'macos'
        run: |
          mkdir -p release-assets
          dmg_path=$(find target/release/bundle -type f -name '*.dmg' | head -n 1)
          if [ -z "$dmg_path" ]; then
            echo "No dmg found in target/release/bundle"
            exit 1
          fi
          cp "$dmg_path" "release-assets/vibe-kanban-${GITHUB_REF_NAME}-macos.dmg"

      - name: Prepare Linux release assets
        if: matrix.platform == 'linux'
        run: |
          mkdir -p release-assets

          appimage_path=$(find target/release/bundle -type f -name '*.AppImage' | head -n 1)
          if [ -z "$appimage_path" ]; then
            echo "No AppImage found in target/release/bundle"
            exit 1
          fi
          cp "$appimage_path" "release-assets/vibe-kanban-${GITHUB_REF_NAME}-linux.AppImage"

          deb_path=$(find target/release/bundle -type f -name '*.deb' | head -n 1)
          if [ -z "$deb_path" ]; then
            echo "No deb found in target/release/bundle"
            exit 1
          fi
          cp "$deb_path" "release-assets/vibe-kanban-${GITHUB_REF_NAME}-linux.deb"

      - name: Prepare Windows release asset
        if: matrix.platform == 'windows'
        run: |
          mkdir -p release-assets
          exe_path=$(find target/release/bundle -type f -name '*.exe' | head -n 1)
          if [ -z "$exe_path" ]; then
            echo "No exe found in target/release/bundle"
            exit 1
          fi
          cp "$exe_path" "release-assets/vibe-kanban-${GITHUB_REF_NAME}-windows.exe"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build-desktop
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: false
          files: release-assets/*
