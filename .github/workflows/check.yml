name: Check

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 22
  PNPM_VERSION: 10.13.1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: ./.github/actions/setup-node

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2025-12-04

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          if apt-cache show libwebkit2gtk-4.1-dev >/dev/null 2>&1; then
            WEBKIT_PACKAGE=libwebkit2gtk-4.1-dev
          else
            WEBKIT_PACKAGE=libwebkit2gtk-4.0-dev
          fi
          if apt-cache show libayatana-appindicator3-dev >/dev/null 2>&1; then
            APPINDICATOR_PACKAGE=libayatana-appindicator3-dev
          else
            APPINDICATOR_PACKAGE=libappindicator3-dev
          fi
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            "${WEBKIT_PACKAGE}" \
            "${APPINDICATOR_PACKAGE}" \
            librsvg2-dev \
            patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend check
        run: pnpm run frontend:check

      - name: Backend check
        run: pnpm run backend:check
