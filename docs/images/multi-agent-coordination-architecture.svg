<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" width="1400" height="980">
  <style>
    text { font-family: Arial, Helvetica, sans-serif; }
    .title { fill: #111827; font-size: 28px; font-weight: 700; }
    .subtitle { fill: #6b7280; font-size: 14px; }
    .layer-title { fill: #111827; font-size: 18px; font-weight: 700; }
    .layer-subtitle { fill: #6b7280; font-size: 12px; }
    .node-title { fill: #111827; font-size: 15px; font-weight: 700; }
    .node-text { fill: #374151; font-size: 13px; }
    .small { fill: #6b7280; font-size: 12px; }
    .tiny { fill: #6b7280; font-size: 11px; }
  </style>
  <defs>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#111827" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 3, 0 6" fill="#ea580c"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 3, 0 6" fill="#059669"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 3, 0 6" fill="#6b7280"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 8 3, 0 6" fill="#7c3aed"/>
    </marker>
  </defs>
  <rect width="1400" height="980" fill="#ffffff"/>

  <text x="60" y="48" class="title">Vibe Kanban Multi-Agent Coordination Architecture</text>
  <text x="60" y="74" class="subtitle">A local-first system for turning work intent into isolated, observable, reviewable agentic software delivery.</text>

  <rect x="60" y="104" width="970" height="122" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="78" y="134" text-anchor="start" class="layer-title">Presentation Layer</text>
  <text x="78" y="158" text-anchor="start" class="layer-subtitle">Entry points for intent, feedback, observation, and delivery decisions.</text>
  <rect x="60" y="254" width="970" height="166" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="78" y="284" text-anchor="start" class="layer-title">Orchestration Layer</text>
  <text x="78" y="308" text-anchor="start" class="layer-subtitle">Routes task attempts onto concrete executor runtimes while preserving isolation and observability.</text>
  <rect x="60" y="448" width="970" height="260" rx="12" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <text x="78" y="478" text-anchor="start" class="layer-title">Domain Layer</text>
  <text x="78" y="502" text-anchor="start" class="layer-subtitle">A semantic model for agentic software delivery.</text>
  <rect x="60" y="740" width="970" height="116" rx="12" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="78" y="770" text-anchor="start" class="layer-title">Persistence Layer</text>
  <text x="78" y="794" text-anchor="start" class="layer-subtitle">Local source of truth for state, code isolation, execution history, and artifacts.</text>

  <rect x="94" y="174" width="142" height="38" rx="9" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="165.0" y="198" text-anchor="middle" class="node-text">Human Workspace</text>
  <rect x="254" y="174" width="142" height="38" rx="9" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="325.0" y="198" text-anchor="middle" class="node-text">Agent Workspace</text>
  <rect x="414" y="174" width="126" height="38" rx="9" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
