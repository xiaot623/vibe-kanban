[package]
name = "vibe-kanban-desktop"
version.workspace = true
edition = "2021"
description = "Vibe Kanban Desktop Application"

[build-dependencies]
tauri-build = { workspace = true, features = [] }

[dependencies]
tauri = { workspace = true, features = ["devtools"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

# Desktop-only dependencies (not needed for Android)
[target.'cfg(not(target_os = "android"))'.dependencies]
server = { path = "../server" }
deployment = { path = "../deployment" }
local-deployment = { path = "../local-deployment" }
services = { path = "../services" }
utils = { path = "../utils" }
db = { path = "../db" }
axum = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { version = "4", features = ["derive", "env"] }
nosleep = "0.2.1"
gethostname = "0.5"
reqwest = { workspace = true }
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[[bin]]
name = "vibe-kanban-desktop"
path = "src/main.rs"

[lib]
name = "vibe_kanban_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"
